<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AI-powered SOC console: Wazuh alert detection handoff, redacted AI analysis verified against the log, and a command center with KPIs.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://api.anthropic.com; base-uri 'none'; form-action 'none'">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>AI-Powered SOC Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Direction: Apple-style glass console — translucent header and cards over a quiet aurora, pill controls, SF-like type; redaction chips stay the signature mark. */
:root {
  --bg: #F5F5F7; --bg-glow-1: rgba(0, 113, 227, .10); --bg-glow-2: rgba(94, 92, 230, .08);
  --surface: rgba(255, 255, 255, .78); --surface-solid: #FFFFFF; --surface-2: rgba(118, 118, 128, .10); --ink: #1D1D1F; --ink-2: #424245; --ink-3: #6E6E73;
  --line: rgba(0, 0, 0, .09); --line-2: rgba(0, 0, 0, .05);
  --accent: #0071E3; --accent-2: #5E5CE6; --accent-weak: rgba(0, 113, 227, .10); --on-accent: #FFFFFF;
  --bar: #1D1D1F; --on-bar: #F5F5F7;
  --ok: #1E7F38; --ok-weak: rgba(52, 199, 89, .14); --warn: #A35200; --warn-weak: rgba(255, 149, 0, .14); --bad: #C4161C; --bad-weak: rgba(255, 59, 48, .12); --info: #0060C0; --info-weak: rgba(0, 113, 227, .10);
  --sev-low: #1E8E3E; --sev-medium: #C56A00; --sev-high: #D9480F; --sev-critical: #C4161C;
  --shadow: 0 0 0 1px rgba(0, 0, 0, .04), 0 8px 28px rgba(0, 0, 0, .07);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 .5px rgba(0, 0, 0, .06);
  --f-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', system-ui, sans-serif;
  --f-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --r: 14px; --r-lg: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --bg-glow-1: rgba(10, 132, 255, .22); --bg-glow-2: rgba(94, 92, 230, .16);
  --surface: rgba(28, 28, 30, .72); --surface-solid: #1C1C1E; --surface-2: rgba(44, 44, 46, .78); --ink: #F5F5F7; --ink-2: #C7C7CC; --ink-3: #8E8E93;
  --line: rgba(255, 255, 255, .10); --line-2: rgba(255, 255, 255, .06);
  --accent: #0A84FF; --accent-2: #5E5CE6; --accent-weak: rgba(10, 132, 255, .18); --on-accent: #FFFFFF;
  --bar: #F5F5F7; --on-bar: #000000;
  --ok: #30D158; --ok-weak: rgba(48, 209, 88, .16); --warn: #FF9F0A; --warn-weak: rgba(255, 159, 10, .16); --bad: #FF453A; --bad-weak: rgba(255, 69, 58, .16); --info: #64D2FF; --info-weak: rgba(100, 210, 255, .14);
  --sev-low: #30D158; --sev-medium: #FF9F0A; --sev-high: #FF6B3D; --sev-critical: #FF453A;
  --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 10px 30px rgba(0, 0, 0, .45);
  --shadow-sm: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 1px 2px rgba(0, 0, 0, .5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --bg-glow-1: rgba(10, 132, 255, .22); --bg-glow-2: rgba(94, 92, 230, .16);
  --surface: rgba(28, 28, 30, .72); --surface-solid: #1C1C1E; --surface-2: rgba(44, 44, 46, .78); --ink: #F5F5F7; --ink-2: #C7C7CC; --ink-3: #8E8E93;
  --line: rgba(255, 255, 255, .10); --line-2: rgba(255, 255, 255, .06);
  --accent: #0A84FF; --accent-2: #5E5CE6; --accent-weak: rgba(10, 132, 255, .18); --on-accent: #FFFFFF;
  --bar: #F5F5F7; --on-bar: #000000;
  --ok: #30D158; --ok-weak: rgba(48, 209, 88, .16); --warn: #FF9F0A; --warn-weak: rgba(255, 159, 10, .16); --bad: #FF453A; --bad-weak: rgba(255, 69, 58, .16); --info: #64D2FF; --info-weak: rgba(100, 210, 255, .14);
  --sev-low: #30D158; --sev-medium: #FF9F0A; --sev-high: #FF6B3D; --sev-critical: #FF453A;
  --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 10px 30px rgba(0, 0, 0, .45);
  --shadow-sm: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 1px 2px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .005em; }
p { margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: .86em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.nav { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 24px; padding-block: 10px 0; }
.brand { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; min-width: 0; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.brand .hint { font-size: 12.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; cursor: pointer; font-weight: 600; color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.tab .tn { font-family: var(--f-mono); font-size: 11px; font-weight: 500; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink-3); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] .tn { border-color: var(--accent); color: var(--accent); }
.tab:hover { color: var(--ink); }
.objective { color: var(--ink-2); max-width: 70ch; margin-top: 6px; }

/* redaction token — the signature mark */
.redact { display: inline-block; background: var(--bar); color: var(--on-bar); font-family: var(--f-mono); font-size: .82em; font-weight: 500; padding: 0 .4em; border-radius: 2px; line-height: 1.45; letter-spacing: .02em; }

/* desk layout */
.desk { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; padding-block: 24px 64px; align-items: start; }
.queue { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.queue h2 { font-size: 13px; font-family: var(--f-mono); font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.qcard { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 12px 12px 16px; cursor: pointer; display: grid; gap: 6px; position: relative; overflow: hidden; }
.qcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--sevc, var(--line)); }
.qcard[aria-current="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.qcard:hover { border-color: var(--ink-3); }
.qhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.qid { font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.qscen { display: block; font-family: var(--f-display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.qmeta { display: block; font-size: 12.5px; color: var(--ink-2); }
.dots { display: flex; gap: 3px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
.dots i.on { background: var(--accent); }
.queue .note { font-size: 12.5px; color: var(--ink-3); }

.sev { --c: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--c); white-space: nowrap; }
.sev::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: var(--c); }
.sev-Low { --c: var(--sev-low); } .sev-Medium { --c: var(--sev-medium); } .sev-High { --c: var(--sev-high); } .sev-Critical { --c: var(--sev-critical); }
.badge { display: inline-block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.badge.sample { border-style: dashed; }
.badge.live { border-color: var(--accent); color: var(--accent); }
.badge.warn { border-color: var(--warn); color: var(--warn); }

/* workspace */
.work { min-width: 0; display: grid; gap: 16px; }
.case-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.case-head h2 { font-size: 26px; font-weight: 700; }
.case-head h2 .mono { font-size: 15px; color: var(--ink-3); margin-right: 8px; font-weight: 500; }
.steps { display: flex; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow-x: auto; }
.step { flex: 1 0 auto; background: none; border: 0; border-right: 1px solid var(--line); padding: 10px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.step:last-child { border-right: 0; }
.step .num { font-family: var(--f-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--line); }
.step.done .num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step[aria-selected="true"] { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); font-weight: 600; }

.panel { grid-template-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 18px; min-width: 0; }
.panel h3 { font-size: 19px; font-weight: 600; }
.lede { color: var(--ink-2); max-width: 70ch; }
.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; }
.stack { display: grid; gap: 12px; min-width: 0; align-content: start; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
label.lbl { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
.hint { font-size: 13px; color: var(--ink-3); }
textarea, input[type="text"], select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 0; }
textarea { resize: vertical; }
textarea.code { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.5; min-height: 320px; white-space: pre; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.dark { background: var(--bar); color: var(--on-bar); border-color: var(--bar); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--on-accent); }
.btn.small { padding: 4px 10px; font-size: 13px; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); font-size: 12.5px; padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface-2); display: grid; gap: 10px; min-width: 0; }
.msg { border-radius: 4px; padding: 8px 12px; font-size: 14px; }
.msg.bad { background: var(--bad-weak); color: var(--bad); }
.msg.ok { background: var(--ok-weak); color: var(--ok); }
.msg.warn { background: var(--warn-weak); color: var(--warn); }
.msg.info { background: var(--info-weak); color: var(--info); }

pre.json { margin: 0; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 12px; overflow: auto; max-height: 460px; white-space: pre; }
pre.json.wrap-lines { white-space: pre-wrap; overflow-wrap: anywhere; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }
.kept { color: var(--warn); font-weight: 600; font-size: 12.5px; }

/* analysis + claims */
.ai-block { display: grid; gap: 8px; align-content: start; }
.ai-block h4 { margin: 0; font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 500; }
ul.clean { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.clean li { display: flex; gap: 8px; align-items: baseline; }
.chip { font-family: var(--f-mono); font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.fact { border-color: var(--info); color: var(--info); }
.chip.inference { border-style: dashed; }
.prio-Now { border-color: var(--bad); color: var(--bad); }
.prio-Soon { border-color: var(--warn); color: var(--warn); }

.claim { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; background: var(--surface); position: relative; }
.claim[data-auto="conflict"], .claim[data-auto="missing"] { border-left: 4px solid var(--bad); }
.claim[data-auto="match"], .claim[data-auto="present"] { border-left: 4px solid var(--ok); }
.claim[data-auto="judgment"] { border-left: 4px dashed var(--ink-3); }
.claim .ctext { font-weight: 500; }
.claim .cnum { font-family: var(--f-mono); color: var(--ink-3); margin-right: 6px; }
.evidence { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.evidence dt { color: var(--ink-3); }
.evidence dd { margin: 0; font-family: var(--f-mono); font-size: 12.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
.auto { font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.auto.match, .auto.present { color: var(--ok); } .auto.conflict, .auto.missing { color: var(--bad); } .auto.judgment { color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"].v { background: var(--ok); color: var(--surface); }
.seg button[aria-pressed="true"].r { background: var(--bad); color: var(--surface); }
.seg button[aria-pressed="true"].u { background: var(--ink-2); color: var(--surface); }
.claim .note-in { font-size: 13px; padding: 5px 8px; }
.sevcheck { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sevcell { border: 1px solid var(--line); border-radius: 4px; padding: 10px; background: var(--surface); }
.sevcell .eyebrow { display: block; margin-bottom: 4px; }
.sevcell .big { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); cursor: pointer; }
.opt input { margin-top: 4px; accent-color: var(--accent); }

/* summary sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 28px 30px; display: grid; gap: 18px; max-width: 820px; box-shadow: 0 1px 0 var(--line), 0 8px 24px -16px rgba(0,0,0,.25); }
.sheet .stamp { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.sheet h3 { font-size: 26px; font-weight: 700; }
.sheet h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
.sheet .struck { text-decoration: line-through; color: var(--ink-3); }
.sheet .ev { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.sheet .foot { font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 10px; }
.sheet .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 16px; font-size: 13.5px; }
.sheet .facts div span { display: block; color: var(--ink-3); font-size: 11.5px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; }
.sheet .facts div b { font-weight: 500; overflow-wrap: anywhere; }
.sheet .sevline { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; font-size: 14px; }
.sheet .sevline .sev { font-size: 16px; }

.site-foot { padding-block: 0 40px; font-size: 12.5px; color: var(--ink-3); }
/* shared view shell */
.view { padding-block: 28px 64px; display: grid; gap: 20px; max-width: 1160px; margin: 0 auto; }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.vhead h1 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 700; line-height: 1.05; margin-top: 4px; }
.vhead > div:first-child { min-width: 0; flex: 1 1 420px; }
.code-wrap { position: relative; min-width: 0; }
.code-wrap pre { padding-right: 66px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; }
.code-wrap .copy { position: absolute; top: 6px; right: 6px; }
.stepname { font-family: var(--f-display); font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.stepname .num { font-family: var(--f-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--bar); color: var(--on-bar); }
.strip { display: flex; flex-wrap: wrap; gap: 6px; }
.scen { border-top: 4px solid var(--accent); }
.scen .chip { white-space: normal; }
.checks-list { display: grid; gap: 6px; }
.checks-list label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.checks-list input { margin-top: 3px; accent-color: var(--accent); }

/* command center */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 4px; align-content: start; background: var(--surface); border-top: 4px solid var(--kc, var(--line)); }
.kpi b { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12.5px; }
.kpi-good { --kc: var(--ok); } .kpi-warn { --kc: var(--warn); } .kpi-bad { --kc: var(--bad); } .kpi-none { --kc: var(--line); }
.tl { display: grid; gap: 10px; }
/* Sequence layout: events in time order, evenly spaced, with the real gap written on each connector. */
.tl-seq { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 2px; }
.tl-node { flex: 1 1 0; min-width: 150px; display: grid; gap: 4px; align-content: start; }
.tl-rail { display: flex; align-items: center; gap: 0; height: 16px; }
.tl-rail .line { flex: 1; height: 2px; background: var(--line); }
.tl-rail .line.on { background: var(--ink-3); }

  var NON_PERSONAL = new Set(['root', 'daemon', 'nobody', 'sshd', 'www-data', 'system',
    'admin', 'administrator', 'guest', 'test', 'oracle', 'ubuntu', 'user', 'localhost', 'wazuh',
    'administrators', 'users', 'guests', 'remote desktop users', 'builtin', 'workgroup', 'nt authority',
    'local service', 'network service', 'anonymous logon', 'defaultaccount', 'wdagutilityaccount']);
  var USER_FIELDS = new Set(['data.srcuser', 'data.dstuser', 'data.user', 'data.username',
    'data.win.eventdata.targetUserName', 'data.win.eventdata.subjectUserName',
    'syscheck.uname_after', 'syscheck.uname_before', 'syscheck.audit.login_user.name',
    'syscheck.audit.effective_user.name', 'syscheck.audit.user.name',
    'data.win.eventdata.samAccountName', 'data.win.eventdata.memberName', 'data.win.eventdata.displayName']);
  var HOST_FIELDS = new Set(['agent.name', 'manager.name', 'predecoder.hostname', 'data.hostname',
    'data.win.system.computer', 'data.win.eventdata.workstationName', 'hostname']);
  var NON_PERSONAL_PATH_USERS = new Set(['public', 'default', 'default user', 'all users']);
  var NON_PERSONAL_IP = new Set(['127.0.0.1', '0.0.0.0', '255.255.255.255']);

  var RE_IPV4 = /(?<![\d.])(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?![\d.]*\d)/g;
  var RE_EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
  var RE_HOME = /\/home\/([A-Za-z0-9._-]+)/g;
  var RE_WINUSER = /[\\/]Users[\\/]([A-Za-z0-9._ -]{2,40}?)(?=[\\/]|$)/gi;
  var RE_SID = /\bS-1-5-21-\d+-\d+-\d+-\d+\b/g;   // machine/domain account SIDs; well-known SIDs stay visible
  var RE_TOKEN = /\b(?:USER|HOST|IP|EMAIL|SID|TERM)_\d+\b/g;

  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  /* ---------- parsing ---------- */

  // Accepts a Wazuh alert object, a dashboard document ({_source}), or an array (first item).
  function parseAlert(raw) {
    if (typeof raw !== 'string' || !raw.trim()) return { ok: false, error: 'empty' };
    if (raw.length > MAX_RAW) return { ok: false, error: 'too_large' };
    var obj;
    try { obj = JSON.parse(raw); } catch (e) { return { ok: false, error: 'invalid_json' }; }
    if (Array.isArray(obj)) obj = obj[0];
    if (obj && typeof obj === 'object' && obj._source && typeof obj._source === 'object') obj = obj._source;
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, error: 'not_object' };
    if (!obj.rule || typeof obj.rule !== 'object') return { ok: false, error: 'no_rule' };
    return { ok: true, alert: obj };
  }

  function getPath(obj, path) {
    if (!path) return undefined;
    var parts = String(path).replace(/\[(\d+)\]/g, '.$1').split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null || typeof cur !== 'object') return undefined;
      if (!Object.prototype.hasOwnProperty.call(cur, parts[i])) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  var GROUP_EVENTS = new Set(['4727', '4728', '4729', '4731', '4732', '4733', '4754', '4756', '4757']);
  function keyFields(alert) {
    var a = alert || {};
    var mitre = getPath(a, 'rule.mitre.id');
    var ev = str(getPath(a, 'data.win.system.eventID'));
    var ed = function (f) { var v = getPath(a, 'data.win.eventdata.' + f); return v == null || v === '-' ? '' : String(v); };
    var isGroup = GROUP_EVENTS.has(ev);
    var user = getPath(a, 'data.dstuser') || getPath(a, 'data.srcuser') || getPath(a, 'data.user') ||
      (isGroup ? (ed('memberName') || ed('memberSid')) : ed('targetUserName')) || '';
    var src = getPath(a, 'data.srcip') || ed('ipAddress');
    return {
      eventId: ev,
      eventTime: str(getPath(a, 'data.win.system.systemTime')),
      actor: ed('subjectUserName'),
      group: isGroup ? ed('targetUserName') : '',
      logonType: ed('logonType'),
      alertId: str(getPath(a, 'id')),
      time: str(getPath(a, 'timestamp')),
      ruleId: str(getPath(a, 'rule.id')),
      level: num(getPath(a, 'rule.level')),
      description: str(getPath(a, 'rule.description')),
      agent: str(getPath(a, 'agent.name')),
      srcip: str(src),
      user: str(user),
      path: str(getPath(a, 'syscheck.path')),
      mitre: Array.isArray(mitre) ? mitre.join(', ') : str(mitre)
    };
  }
  function str(v) { return v == null ? '' : String(v); }
  function num(v) { var n = Number(v); return isFinite(n) ? n : null; }

  /* ---------- redaction ---------- */

  function walk(node, path, visit) {
    if (typeof node === 'string') { visit(node, path); return; }
    if (Array.isArray(node)) { node.forEach(function (v) { walk(v, path, visit); }); return; }
    if (node && typeof node === 'object') {
      Object.keys(node).forEach(function (k) { walk(node[k], path ? path + '.' + k : k, visit); });
    }
  }

  // Finds personal/confidential values across all alerts and gives each a stable token.
  // Tokens are assigned in discovery order and never renumbered, so keeping a value
  // visible does not shift the others.
  // `prior` is the persisted token map [{value, token}]: a value keeps its token for good,
  // so editing one incident never renumbers the tokens that saved analyses refer to.
  function collectEntities(alerts, customTerms, prior) {
    var found = new Map();             // lower-cased value -> entity present now
    var known = new Map();             // lower-cased value -> {value, type, token}, all time
    var counters = { USER: 0, HOST: 0, IP: 0, EMAIL: 0, SID: 0, TERM: 0 };
    (Array.isArray(prior) ? prior : []).forEach(function (e) {
      if (!e || typeof e.value !== 'string' || typeof e.token !== 'string') return;
      var m = /^([A-Z]+)_(\d{1,6})$/.exec(e.token);
      if (!m || !Object.prototype.hasOwnProperty.call(counters, m[1])) return;
      var key = e.value.toLowerCase();
      if (known.has(key)) return;
      known.set(key, { value: e.value.slice(0, 200), type: m[1], token: e.token });
      counters[m[1]] = Math.max(counters[m[1]], Number(m[2]));
    });
    function add(value, type) {
      var v = String(value).trim();
      if (v.length < 2) return;
      var key = v.toLowerCase();
      if (found.has(key)) return;
      var prev = known.get(key);
      if (prev) { found.set(key, { value: v, type: prev.type, token: prev.token, count: 0 }); return; }
      if (type === 'USER' && (NON_PERSONAL.has(key) || v === '-' || /\$$/.test(v) || /^S-1-/.test(v))) return;
      if (type === 'HOST' && NON_PERSONAL.has(key)) return;
      if (type === 'IP' && NON_PERSONAL_IP.has(v)) return;
      counters[type] += 1;
      var ent = { value: v, type: type, token: type + '_' + counters[type], count: 0 };
      known.set(key, { value: v, type: type, token: ent.token });
      found.set(key, ent);
    }
    (alerts || []).forEach(function (alert) {
      if (!alert) return;
      walk(alert, '', function (s, path) {
        if (USER_FIELDS.has(path)) add(s, 'USER');
        if (HOST_FIELDS.has(path)) add(s, 'HOST');
        var m;
        RE_EMAIL.lastIndex = 0; while ((m = RE_EMAIL.exec(s))) add(m[0], 'EMAIL');
        RE_IPV4.lastIndex = 0; while ((m = RE_IPV4.exec(s))) add(m[0], 'IP');
        RE_HOME.lastIndex = 0; while ((m = RE_HOME.exec(s))) add(m[1], 'USER');
        RE_WINUSER.lastIndex = 0; while ((m = RE_WINUSER.exec(s))) if (!NON_PERSONAL_PATH_USERS.has(m[1].toLowerCase())) add(m[1], 'USER');
        RE_SID.lastIndex = 0; while ((m = RE_SID.exec(s))) add(m[0], 'SID');
      });
    });
    String(customTerms || '').split(/[,\n]/).forEach(function (t) {
      var v = t.trim();
      if (v.length >= 2 && v.length <= 80) add(v, 'TERM');
    });
    return { list: Array.from(found.values()), tokens: Array.from(known.values()).map(function (e) { return { value: e.value, token: e.token }; }) };
  }

  function buildMatcher(entities, keep) {
    var keepSet = new Set((keep || []).map(function (k) { return String(k).toLowerCase(); }));
    var active = entities.filter(function (e) { return !keepSet.has(e.value.toLowerCase()); })
      .sort(function (a, b) { return b.value.length - a.value.length; });
    if (!active.length) return null;
    var parts = active.map(function (e) {
      var body = escapeRe(e.value);
      return e.type === 'IP' ? '(?<![\\d.])' + body + '(?![\\d])' : '(?<![\\w.-])' + body + '(?![\\w-])';
    });
    var byKey = new Map(active.map(function (e) { return [e.value.toLowerCase(), e]; }));
    return { re: new RegExp(parts.join('|'), 'gi'), byKey: byKey };
  }

  // One regex pass with alternation: replacements never cascade into tokens.
  function redactString(s, matcher, counts) {
    if (!matcher) return s;
    return s.replace(matcher.re, function (hit) {
      var e = matcher.byKey.get(hit.toLowerCase());
      if (!e) return hit;
      if (counts) counts[e.token] = (counts[e.token] || 0) + 1;
      return e.token;
    });
  }

  function redactDeep(node, matcher, counts) {
    if (typeof node === 'string') return redactString(node, matcher, counts);
    if (Array.isArray(node)) return node.map(function (v) { return redactDeep(v, matcher, counts); });
    if (node && typeof node === 'object') {
      var out = {};
      Object.keys(node).forEach(function (k) { out[k] = redactDeep(node[k], matcher, counts); });
      return out;
    }
    return node;
  }

  function redactAll(alerts, customTerms, keep, prior) {
    var col = collectEntities(alerts, customTerms, prior);
    var entities = col.list;
    var matcher = buildMatcher(entities, keep);
    var counts = {};
    var redacted = (alerts || []).map(function (a) { return a ? redactDeep(a, matcher, counts) : null; });
    entities.forEach(function (e) { e.count = counts[e.token] || 0; });
    return { entities: entities, redacted: redacted, tokens: col.tokens };
  }

  // Tokenizes any object (e.g. an analysis written with real values) using a saved token map.
  function redactWith(node, tokens) {
    var ents = (Array.isArray(tokens) ? tokens : []).filter(function (t) { return t && typeof t.value === 'string' && /^[A-Z]+_\d+$/.test(t.token); })
      .map(function (t) { return { value: t.value, token: t.token, type: t.token.split('_')[0] }; });
    return redactDeep(node, buildMatcher(ents, []), null);
  }

  // Moves an object written against one token map onto another (via the real values).
  function retokenize(node, fromTokens, toTokens) {
    return redactWith(JSON.parse(detokenize(JSON.stringify(node), fromTokens)), toTokens);
  }

  // Splits text into plain and token segments for highlighted rendering.
  function tokenSegments(text) {
    var out = [], last = 0, m;
    RE_TOKEN.lastIndex = 0;
    while ((m = RE_TOKEN.exec(text))) {
      if (m.index > last) out.push({ t: text.slice(last, m.index) });
      out.push({ t: m[0], token: true });
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push({ t: text.slice(last) });
    return out;
  }

  /* ---------- severity ---------- */

  // Wazuh dashboard bands: 0-6 Low, 7-11 Medium, 12-14 High, 15 Critical.
  function wazuhBand(level) {
    if (level == null || !isFinite(level)) return null;
    if (level >= 15) return 'Critical';
    if (level >= 12) return 'High';
    if (level >= 7) return 'Medium';
    return 'Low';
  }
  function compareSeverity(ai, band) {
    var a = SEVERITIES.indexOf(ai), b = SEVERITIES.indexOf(band);
    if (a < 0 || b < 0) return { diff: null, label: 'No comparison' };
    var d = a - b;
    if (d === 0) return { diff: 0, label: 'AI agrees with the Wazuh level' };
    if (d > 0) return { diff: d, label: 'AI rates ' + d + ' band' + (d > 1 ? 's' : '') + ' above Wazuh — justify or lower' };
    return { diff: d, label: 'AI rates ' + (-d) + ' band' + (d < -1 ? 's' : '') + ' below Wazuh — justify or raise' };
  }

  /* ---------- AI answer ---------- */

  function clip(v, n) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n); }
  function pick(v, allowed, dflt) {
    var s = clip(v, 20).toLowerCase();
    for (var i = 0; i < allowed.length; i++) if (allowed[i].toLowerCase() === s) return allowed[i];
    return dflt;
  }

  // Tolerant JSON extraction for answers pasted from any AI tool.
  function extractJson(text) {
    var t = String(text || '').trim();
    if (!t) throw new Error('empty');
    if (t.length > MAX_RAW) throw new Error('too_large');
    try { return JSON.parse(t); } catch (e) { /* try harder */ }
    var fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) { try { return JSON.parse(fence[1]); } catch (e) { /* fall through */ } }
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
    throw new Error('invalid_json');
  }

  // Validates and bounds an analysis object. Never trusts shape or size.
  function sanitizeAnalysis(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('not_object');
    var arr = function (v, max) { return Array.isArray(v) ? v.slice(0, max) : []; };
    var tech = raw.attack_technique && typeof raw.attack_technique === 'object' ? raw.attack_technique : {};
    var techId = clip(tech.id, 16);
    var out = {
      severity: pick(raw.severity, SEVERITIES, 'Unrated'),
      severity_reason: clip(raw.severity_reason, 600),
      attack_technique: { id: /^T\d{4}(\.\d{3})?$/.test(techId) ? techId : '', name: clip(tech.name, 80) },
      hypotheses: arr(raw.hypotheses, 5).map(function (h) {
        h = h && typeof h === 'object' ? h : { text: h };
        return { text: clip(h.text, 400), likelihood: pick(h.likelihood, LIKELIHOODS, 'Medium') };
      }).filter(function (h) { return h.text; }),
      claims: arr(raw.claims, 12).map(function (c) {
        c = c && typeof c === 'object' ? c : { text: c };
        var field = clip(c.field, 120);
        if (!/^[A-Za-z0-9_.\[\]-]+$/.test(field)) field = '';
        var type = pick(c.type, ['fact', 'inference'], field ? 'fact' : 'inference');
        if (type === 'inference') field = '';
        return { text: clip(c.text, 500), type: type, field: field, value: clip(c.value, 300) };
      }).filter(function (c) { return c.text; }),
      response_options: arr(raw.response_options, 8).map(function (o) {
        o = o && typeof o === 'object' ? o : { action: o };
        return { action: clip(o.action, 300), priority: pick(o.priority, PRIORITIES, 'Soon') };
      }).filter(function (o) { return o.action; }),
      unknowns: arr(raw.unknowns, 6).map(function (u) { return clip(u, 300); }).filter(Boolean)
    };
    if (!out.claims.length && out.severity === 'Unrated') throw new Error('no_content');
    return out;
  }

  /* ---------- claim checks ---------- */

  function norm(v) { return String(v).trim().toLowerCase(); }
  function display(v) {
    if (v === undefined) return '';
    if (typeof v === 'string') return v;
    return JSON.stringify(v);
  }

  // Compares a claim's cited field/value with the redacted alert.
  // States: match, conflict, missing, present (field exists, no value cited), judgment.
  function checkClaim(claim, alert) {
    if (!claim || claim.type !== 'fact' || !claim.field) return { state: 'judgment', actual: '' };
    var v = getPath(alert, claim.field);
    if (v === undefined) return { state: 'missing', actual: '' };
    var actual = display(v);
    if (!claim.value) return { state: 'present', actual: actual };
    var want = norm(claim.value);
    var ok;
    if (Array.isArray(v)) ok = v.some(function (x) { return norm(display(x)) === want || norm(display(x)).indexOf(want) >= 0; });
    else ok = norm(actual) === want || norm(actual).indexOf(want) >= 0;
    return { state: ok ? 'match' : 'conflict', actual: actual };
  }

  /* ---------- prompt ---------- */

  var SCHEMA_EXAMPLE = {
    severity: 'Low | Medium | High | Critical',
    severity_reason: 'one or two sentences',
    attack_technique: { id: 'T1110', name: 'Brute Force' },
    hypotheses: [{ text: 'what may explain the alert', likelihood: 'High | Medium | Low' }],
    claims: [
      { text: 'a fact read from the alert', type: 'fact', field: 'data.srcip', value: 'IP_2' },
      { text: 'a conclusion not directly in the alert', type: 'inference', field: '', value: '' }
    ],
    response_options: [{ action: 'what the SOC should do', priority: 'Now | Soon | Later' }],
    unknowns: ['what the alert cannot tell us']
  };

  function buildPrompt(inc, redacted, context, lang) {
    var k = keyFields(redacted);
    var band = wazuhBand(k.level);
    var lines = [
      'You are assisting a SOC analyst in a university lab exercise (Wazuh SIEM, lab data only).',
      'Analyse the Wazuh alert below. Personal and confidential values were replaced with tokens such as USER_1, HOST_1, IP_1 and SID_1. Keep using the tokens exactly as written and never guess the real values.',
      '',
      'Rules:',
      '1. Every claim of type "fact" must be read from one field of the alert JSON. Give the field as a dot-path (for example data.srcip or rule.groups) and the value you read there.',
      '2. Anything you conclude but cannot read in a single field is type "inference", with an empty field and value.',
      '3. Rate severity as Low, Medium, High or Critical. The Wazuh rule level is ' + (k.level == null ? 'unknown' : k.level) +
        (band ? ' (Wazuh band: ' + band + ')' : '') + '. If you rate differently, say why in severity_reason.',
      '4. Give 2 or 3 hypotheses, including the possibility that this is a lab test event.',
      '5. Give 3 to 5 response options that a SOC command center can act on, each with a priority.',
      '6. List what the alert cannot tell us.',
      '7. Make 5 to 9 claims, mostly facts. Do not invent fields that are not in the JSON.'
    ];
    if (lang === 'fr') lines.push('8. Write every text value in French. Keep the JSON keys and these values in English: Low, Medium, High, Critical, Now, Soon, Later, fact, inference.');
    if (context && context.length) {
      lines.push('', 'Other alerts from the same exercise (context only, do not cite them as fields):');
      context.forEach(function (c) { lines.push('- ' + c); });
    }
    lines.push('', 'Alert ' + inc.id + ' (scenario: ' + inc.scenario + '):', JSON.stringify(redacted, null, 2),
      '', 'Reply with only one JSON object in this shape:', JSON.stringify(SCHEMA_EXAMPLE, null, 2));
    return lines.join('\n');
  }

  function contextLine(inc, redacted) {
    var k = keyFields(redacted);
    var where = k.agent ? ' on ' + k.agent : '';
    return inc.id + ' ' + k.time + ': rule ' + k.ruleId + ' level ' + k.level + where + ' — ' + k.description +
      (k.srcip ? ' (src ' + k.srcip + ')' : '') + (k.user ? ' (user ' + k.user + ')' : '');
  }

  /* ---------- summary ---------- */

  // Builds the one-page incident summary from verified material only.
  function summarize(inc, redacted, analysis, review) {
    var k = keyFields(redacted);
    var band = wazuhBand(k.level);
    var claims = analysis ? analysis.claims : [];
    var rv = review || { claims: [], options: [] };
    var verified = [], rejected = [], open = [];
    claims.forEach(function (c, i) {
      var r = rv.claims[i] || { status: 'pending', note: '' };
      var chk = checkClaim(c, redacted);
      var item = { text: c.text, type: c.type, field: c.field, value: c.value, actual: chk.actual, note: r.note || '' };
      if (r.status === 'verified') verified.push(item);
      else if (r.status === 'rejected') rejected.push(item);
      else open.push(Object.assign(item, { pending: r.status !== 'unclear' }));
    });
    var actions = analysis ? analysis.response_options.filter(function (o, i) { return rv.options[i]; }) : [];
    var order = { Now: 0, Soon: 1, Later: 2 };
    actions.sort(function (a, b) { return order[a.priority] - order[b.priority]; });
    return {
      id: inc.id, scenario: inc.scenario, key: k, band: band,
      aiSeverity: analysis ? analysis.severity : '',
      finalSeverity: rv.finalSeverity || '',
      severityNote: rv.severityNote || (analysis ? analysis.severity_reason : ''),
      technique: analysis ? analysis.attack_technique : null,
      verified: verified, rejected: rejected, open: open,
      unknowns: analysis ? analysis.unknowns : [],
      hypotheses: analysis ? analysis.hypotheses : [],
      actions: actions,
      analyst: rv.analyst || '', decision: rv.decision || '',
      total: claims.length, reviewed: verified.length + rejected.length + open.filter(function (o) { return !o.pending; }).length
    };
  }

  function mdCell(s) { return String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\s+/g, ' ').trim() || '—'; }
  function mdLine(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }

  function summaryMarkdown(s, stamp) {
    var L = [];
    L.push('# ' + s.id + ' — ' + s.scenario);
    L.push('Team 3 · AI Analysis → Team 4 · Command Center  ');
    L.push('Analyst: ' + (s.analyst || 'not set') + ' · Prepared ' + (stamp || '') + ' · Claims verified ' + s.verified.length + ' of ' + s.total);
    L.push('');
    L.push('| Alert ID | Rule | Wazuh level | Time | Host | Source |');
    L.push('|---|---|---|---|---|---|');
    L.push('| ' + [s.key.alertId, s.key.ruleId + ' ' + s.key.description, s.key.level, s.key.time, s.key.agent, s.key.srcip || s.key.path].map(mdCell).join(' | ') + ' |');
    L.push('');
    L.push('## Severity');
    L.push('**' + (s.finalSeverity || s.aiSeverity || 'Unrated') + '** (final, human-confirmed' + (s.finalSeverity ? '' : ' — not yet confirmed') + '). Wazuh band: ' + (s.band || '—') + '. AI proposed: ' + (s.aiSeverity || '—') + '.');
    if (s.severityNote) L.push('Why: ' + mdLine(s.severityNote));
    if (s.technique && s.technique.id) L.push('ATT&CK: ' + s.technique.id + ' ' + mdLine(s.technique.name) + ' (AI suggestion)');
    L.push('');
    L.push('## Verified findings');
    if (!s.verified.length) L.push('- None verified yet.');
    s.verified.forEach(function (c) {
      L.push('- ' + mdLine(c.text) + (c.field ? ' — evidence `' + c.field + '` = `' + mdLine(c.actual).slice(0, 120) + '`' : ' — analyst judgment') + (c.note ? ' (' + mdLine(c.note) + ')' : ''));
    });
    if (s.rejected.length) {
      L.push('');
      L.push('## AI claims rejected after checking the log');
      s.rejected.forEach(function (c) {
        L.push('- ~~' + mdLine(c.text) + '~~' + (c.field ? ' — log `' + c.field + '` shows `' + (mdLine(c.actual).slice(0, 120) || 'no such field') + '`' : '') + (c.note ? ' (' + mdLine(c.note) + ')' : ''));

    }

 "Ask the owner to start it; you have view-only access.": "Demandez au propriétaire de le démarrer ; vous êtes en lecture seule.",
 "A change could not be saved yet. It is retried with your next edit.": "Une modification n’a pas encore pu être enregistrée. Nouvel essai à votre prochaine modification.",
 "The shared case file is full, so changes are not being saved. Remove a pasted alert or reset the case.": "Le dossier partagé est plein, les modifications ne sont plus enregistrées. Supprimez une alerte collée ou réinitialisez le dossier.",
 "You can view this console but not change it. Ask the owner for Contributor or Editor access.": "Vous pouvez consulter cette console mais pas la modifier. Demandez au propriétaire un accès Contributeur ou Éditeur.",
 "The shared case file could not be opened, so this console is working in this browser only.": "Le dossier partagé n’a pas pu être ouvert : cette console fonctionne uniquement dans ce navigateur.",
 "Your access to the shared case file changed. Reload the page to continue.": "Votre accès au dossier partagé a changé. Rechargez la page pour continuer.",
 "Live updates stopped. Reload the page to see the latest changes.": "Les mises à jour en direct se sont arrêtées. Rechargez la page pour voir les derniers changements.",
 "Sign in to share this console with your class. For now it works in this browser only.": "Connectez-vous pour partager cette console avec votre classe. Pour l’instant, elle fonctionne uniquement dans ce navigateur.",
 "Team 2 · Detection · Windows Security log on AI-SOC-WIN11 (agent 001)": "Équipe 2 · Détection · journal Sécurité Windows sur AI-SOC-WIN11 (agent 001)",
 "Detect suspicious activity and generate reliable alerts: run three safe tests on the lab endpoint, find each alert in Wazuh, and hand it to Team 3 with the reason it fired.": "Détecter les activités suspectes et produire des alertes fiables : lancer trois tests sans risque sur le poste du labo, retrouver chaque alerte dans Wazuh et la transmettre à l’équipe 3 avec la raison de son déclenchement.",
 "Before you start": "Avant de commencer",
 "Connect Tailscale, then open ": "Connectez Tailscale, puis ouvrez ",
 ". The certificate warning is expected for this lab address only.": ". L’avertissement de certificat est normal pour cette adresse de labo uniquement.",
 "Connect to the lab VPN (Tailscale), then open the dashboard address Team 1 sent you. A certificate warning is expected for a lab address only.": "Connectez-vous au VPN du labo (Tailscale), puis ouvrez l’adresse du tableau de bord envoyée par l’équipe 1. Un avertissement de certificat est normal pour une adresse de labo.",
 "Log in with your own Wazuh account. Never paste a password into this page or a group chat.": "Connectez-vous avec votre propre compte Wazuh. Ne collez jamais de mot de passe dans cette page ni dans une discussion de groupe.",
 "Under Endpoints, check that AI-SOC-WIN11 (001) is Active.": "Dans Endpoints, vérifiez que AI-SOC-WIN11 (001) est Active.",
 "Team 1 owns the Windows VM: ask them to run the setup once, then scenarios 1, 2 and 3 in order, about a minute apart.": "L’équipe 1 gère la VM Windows : demandez-lui de lancer l’installation une fois, puis les scénarios 1, 2 et 3 dans l’ordre, à environ une minute d’intervalle.",
 "In Threat Hunting → Events, set Last 1 hour and paste each card’s query.": "Dans Threat Hunting → Events, choisissez « Last 1 hour » et collez la requête de chaque carte.",
 "Team 1 baseline: failed logon (event 4625) at 20:48:07 UTC → rule 60122, level 5, at 20:51:36. That is 3 min 29 s, so wait about 5 minutes before searching.": "Référence de l’équipe 1 : échec de connexion (événement 4625) à 20:48:07 UTC → règle 60122, niveau 5, à 20:51:36. Soit 3 min 29 s : attendez environ 5 minutes avant de chercher.",
 "Setup on AI-SOC-WIN11 · once, PowerShell as Administrator": "Installation sur AI-SOC-WIN11 · une fois, PowerShell en administrateur",
 "Repeated wrong passwords for one account: the first sign of password guessing.": "Mots de passe erronés répétés sur un compte : le premier signe d’une tentative de deviner le mot de passe.",
 "A successful logon for the account that was just under attack. Wazuh alone rates it Low, which is exactly the gap AI analysis and a human must close.": "Une connexion réussie pour le compte qui venait d’être attaqué. Wazuh seul la classe Faible : c’est exactement l’écart que l’analyse IA et un humain doivent combler.",
 "The attacked account gets local admin rights: the change that turns a guessed password into full control of the machine.": "Le compte attaqué obtient les droits d’administrateur local : le changement qui transforme un mot de passe deviné en contrôle total de la machine.",
 "Failed logon": "Échec de connexion",
 "Successful logon": "Connexion réussie",

 "Generate the test event": "Générer l’événement de test",
 "Find the alert": "Trouver l’alerte",
 "Capture and hand over": "Capturer et transmettre",
 "On AI-SOC-WIN11, PowerShell as Administrator.": "Sur AI-SOC-WIN11, PowerShell en administrateur.",
 "Rule 60122 (level 5) for each failure, then rule 60204 \"Multiple Windows Logon Failures\" (level 10) once 8 failures land within 4 minutes.": "Règle 60122 (niveau 5) pour chaque échec, puis règle 60204 « Multiple Windows Logon Failures » (niveau 10) dès que 8 échecs surviennent en 4 minutes.",
 "A logon-success rule: 60106 \"Windows Logon Success\" or, on this Wazuh version, 67022 \"Non network or service local logon\" (level 3); 67028 marks admin privileges on the new logon.": "Une règle de connexion réussie : 60106 « Windows Logon Success » ou, sur cette version de Wazuh, 67022 « Non network or service local logon » (niveau 3) ; 67028 signale des privilèges administrateur sur la nouvelle session.",
 "Rule 60154 \"Administrators Group Changed\" (level 12). Account changes also raise 60110 \"User account changed\" (level 8) and account creation 60109.": "Règle 60154 « Administrators Group Changed » (niveau 12). Les modifications de compte déclenchent aussi 60110 « User account changed » (niveau 8) et la création de compte 60109.",
 "Hand over the 60204 alert. If it did not fire, hand over the last 60122 alert.": "Transmettez l’alerte 60204. Si elle ne s’est pas déclenchée, transmettez la dernière alerte 60122.",

 "Collect": "Collecter",
 " three alerts from Team 2: alert ID, raw evidence, Wazuh level.": " trois alertes de l’équipe 2 : ID d’alerte, preuves brutes, niveau Wazuh.",
 " accounts, host names, IPs and emails into consistent tokens. A leak check confirms no original value remains.": " les comptes, noms d’hôtes, IP et e-mails en jetons cohérents. Un contrôle de fuite confirme qu’aucune valeur d’origine ne reste.",
 " with a fixed prompt: severity, hypotheses, response options, and claims that each cite one alert field.": " avec un prompt fixe : gravité, hypothèses, options de réponse, et affirmations citant chacune un champ de l’alerte.",
 " every claim. The page reads the cited field; an analyst marks it Verified, Rejected or Can’t tell. A human sets the final severity.": " chaque affirmation. La page lit le champ cité ; un analyste la marque Vérifiée, Rejetée ou Indéterminée. Un humain fixe la gravité finale.",
 "Send": "Envoyer",
 " a one-page summary to Team 4 with verified findings only, rejected AI claims shown struck through, and selected actions.": " une synthèse d’une page à l’équipe 4 avec uniquement les constats vérifiés, les affirmations IA rejetées barrées et les actions choisies.",
 "AI prompts": "Prompts IA",
 "One prompt design for all incidents. It forces the AI to tie each fact to a field, which is what makes checking possible, and to include the lab-test hypothesis.": "Un seul modèle de prompt pour tous les incidents. Il oblige l’IA à relier chaque fait à un champ, ce qui rend la vérification possible, et à envisager l’hypothèse d’un test de labo.",
 "Automatic field check": "Contrôle automatique du champ",
 "What the analyst does": "Ce que fait l’analyste",
 "Usually Verified.": "En général Vérifiée.",
 "Check the value yourself.": "Vérifiez la valeur vous-même.",
 "Usually Rejected. Record what the log shows.": "En général Rejetée. Notez ce qu’indique le journal.",
 "Rejected, or ask Team 2 for the field.": "Rejetée, ou demandez le champ à l’équipe 2.",
 "Verified only if the analyst agrees; otherwise Can’t tell.": "Vérifiée seulement si l’analyste est d’accord ; sinon Indéterminé.",
 "The field check is a helper, not a verdict. A matching field can still be read wrongly, as in INC-01, where Wazuh’s rule name says bad password but the sub-status says wrong PIN.": "Le contrôle de champ est une aide, pas un verdict. Un champ conforme peut encore être mal interprété, comme dans INC-01, où le nom de la règle Wazuh parle de mauvais mot de passe alors que le sous-statut indique un mauvais PIN.",
 "Limitations": "Limites",
 "The AI sees one redacted alert and short summaries of the others. It cannot query Wazuh, so it cannot know what happened before or after.": "L’IA voit une alerte masquée et de courts résumés des autres. Elle ne peut pas interroger Wazuh, donc elle ignore ce qui s’est passé avant ou après.",
 "AI answers change between runs and can state wrong facts confidently. In the lab samples one claim per incident was false, and only checking the field exposed it. Even Wazuh can mislead: rule 60122 says \"bad password\" for what the sub-status shows was a wrong PIN.": "Les réponses de l’IA varient d’une exécution à l’autre et peuvent affirmer des faits faux avec assurance. Dans les échantillons, une affirmation par incident était fausse, et seule la vérification du champ l’a révélé. Même Wazuh peut induire en erreur : la règle 60122 parle de « mauvais mot de passe » alors que le sous-statut indique un mauvais PIN.",
 "The field check compares text. It cannot tell whether a field means what the AI says it means; that needs a person.": "Le contrôle de champ compare du texte. Il ne peut pas savoir si un champ signifie ce que l’IA affirme ; il faut une personne pour cela.",
 "Redaction is rule-based. Names inside free text that are not in known fields can slip through; add them under Extra terms and rely on the leak check.": "Le masquage repose sur des règles. Des noms dans du texte libre hors des champs connus peuvent passer ; ajoutez-les dans « Autres termes » et appuyez-vous sur le contrôle de fuite.",
 "Tokens are pseudonyms, not anonymisation. Anyone this console is shared with can reverse them, so share it only with the class; the AI never receives the mapping.": "Les jetons sont des pseudonymes, pas une anonymisation. Toute personne avec qui la console est partagée peut les inverser : partagez-la uniquement avec la classe ; l’IA ne reçoit jamais la correspondance.",
 "Severity from the AI is advisory. The final severity is set by a Team 3 analyst and can differ from both the AI and the Wazuh level.": "La gravité donnée par l’IA est indicative. La gravité finale est fixée par un analyste de l’équipe 3 et peut différer de celle de l’IA comme du niveau Wazuh.",
 "Lab data only. The prompts, thresholds and redaction rules were not tested on production traffic.": "Données de labo uniquement. Les prompts, seuils et règles de masquage n’ont pas été testés sur du trafic de production.",
 "Reset": "Réinitialiser",
 "Reset the case file": "Réinitialiser le dossier",
 "Click again to reset for everyone": "Cliquez encore pour réinitialiser pour tous",
 "Restore the three real lab alerts with the prepared analyses. This clears every review and decision for everyone using this console.": "Restaurer les trois alertes réelles avec les analyses préparées. Cela efface toutes les vérifications et décisions pour tous les utilisateurs de cette console.",
 "Restore the three real lab alerts with the prepared analyses. This clears your reviews in this browser.": "Restaurer les trois alertes réelles avec les analyses préparées. Cela efface vos vérifications dans ce navigateur.",
 "One failed interactive logon at the machine's own sign-in screen, with no network source and no follow-up in this alert. That matches the Wazuh level 5.": "Un seul échec de connexion interactive sur l’écran de connexion de la machine, sans source réseau ni suite dans cette alerte. Cela correspond au niveau Wazuh 5.",
 "Brute Force (only if more failures follow)": "Force brute (seulement si d’autres échecs suivent)",
 "Team 1 typed a wrong PIN or password on purpose for their baseline test.": "L’équipe 1 a tapé exprès un mauvais PIN ou mot de passe pour son test de référence.",
 "A user mistyped their Windows Hello PIN at the HOST_3 sign-in screen.": "Un utilisateur a mal tapé son PIN Windows Hello sur l’écran de connexion de HOST_3.",
 "Someone with console access to HOST_3 tried to sign in.": "Une personne ayant accès à la console de HOST_3 a tenté de se connecter.",
 "Wazuh rule 60122 fired: logon failure, unknown user or bad password.": "La règle Wazuh 60122 s’est déclenchée : échec de connexion, utilisateur inconnu ou mauvais mot de passe.",
 "The underlying Windows event is 4625, a failed logon.": "L’événement Windows sous-jacent est 4625, un échec de connexion.",
 "It was an interactive logon at the machine's own sign-in screen (logon type 2).": "C’était une connexion interactive sur l’écran de connexion de la machine (type de connexion 2).",
 "The attempt came from the machine itself, not from the network.": "La tentative venait de la machine elle-même, pas du réseau.",
 "Windows did not record which account was tried (null SID).": "Windows n’a pas enregistré quel compte a été tenté (SID nul).",
 "The failure sub-status is 0xc0000380.": "Le sous-statut de l’échec est 0xc0000380.",
 "Sub-status 0xc0000380 is the code Windows uses for a wrong PIN or smart-card credential, so this was most likely a wrong Windows Hello PIN, not a wrong password as the rule name suggests.": "Le sous-statut 0xc0000380 est le code Windows d’un mauvais PIN ou identifiant de carte à puce : il s’agissait donc très probablement d’un mauvais PIN Windows Hello, et non d’un mauvais mot de passe comme le suggère le nom de la règle.",
 "A single failure is not an attack on its own; it matters only if more failures or a success follow.": "Un échec isolé n’est pas une attaque ; il ne compte que si d’autres échecs ou une réussite suivent.",
 "Confirm with Team 1 that this was their test at 20:48 UTC on 8 November.": "Confirmer avec l’équipe 1 qu’il s’agissait de leur test à 20:48 UTC le 8 novembre.",
 "Search HOST_3 for more 4625 events or a 4624 success around that time.": "Chercher sur HOST_3 d’autres événements 4625 ou une réussite 4624 à ce moment-là.",
 "Close as a lab test once Team 1 confirms.": "Clore comme test de labo dès que l’équipe 1 confirme.",
 "Compare the clocks of HOST_3 and HOST_2 to explain the 3.5-minute gap between event and alert.": "Comparer les horloges de HOST_3 et HOST_2 pour expliquer l’écart de 3,5 minutes entre l’événement et l’alerte.",
 "Which account was tried.": "Quel compte a été tenté.",
 "Whether the 3 min 29 s gap is ingestion delay or a clock difference between the Windows VM and the Wazuh server.": "Si l’écart de 3 min 29 s vient d’un délai d’ingestion ou d’une différence d’horloge entre la VM Windows et le serveur Wazuh.",
 "This is the locked screen being unlocked (logon type 7) at the console, four seconds after one wrong PIN. That fits a corrected typo, not an attack. The session runs with an elevated admin token, which is worth noting but is not suspicious on its own.": "C’est le déverrouillage de l’écran verrouillé (type de connexion 7) sur la console, quatre secondes après un seul mauvais PIN. Cela correspond à une faute de frappe corrigée, pas à une attaque. La session dispose d’un jeton administrateur élevé, ce qui mérite d’être noté mais n’est pas suspect en soi.",
 "Valid Accounts": "Comptes valides",
 "The account owner mistyped the PIN on the lock screen and unlocked on the next try.": "Le propriétaire du compte a mal tapé le PIN sur l’écran de verrouillage puis a déverrouillé à l’essai suivant.",
 "Team 1 unlocked the VM while preparing the baseline test.": "L’équipe 1 a déverrouillé la VM en préparant le test de référence.",
 "Someone else who knows the PIN unlocked the console.": "Une autre personne connaissant le PIN a déverrouillé la console.",
 "Wazuh rule 67022 fired: a local, non-network logon succeeded.": "La règle Wazuh 67022 s’est déclenchée : une connexion locale, hors réseau, a réussi.",
 "The underlying Windows event is 4624, a successful logon.": "L’événement Windows sous-jacent est 4624, une connexion réussie.",
 "Logon type 7 means the locked screen was unlocked; it is not a new sign-in and not a remote session.": "Le type de connexion 7 signifie que l’écran verrouillé a été déverrouillé ; ce n’est ni une nouvelle connexion ni une session à distance.",
 "The account that unlocked is the Microsoft account USER_1.": "Le compte qui a déverrouillé est le compte Microsoft USER_1.",
 "It is the same account that was changed in INC-03 (same SID).": "C’est le même compte que celui modifié dans INC-03 (même SID).",
 "The session holds an elevated token (%%1842 means Yes), so the account is a local administrator.": "La session dispose d’un jeton élevé (%%1842 signifie Oui) : le compte est donc administrateur local.",
 "Windows logged the unlock at 20:48:11 UTC, four seconds after the failed logon in INC-01.": "Windows a enregistré le déverrouillage à 20:48:11 UTC, quatre secondes après l’échec de connexion de INC-01.",
 "Together with INC-01 this reads as a wrong PIN on the lock screen corrected four seconds later, not password guessing.": "Avec INC-01, cela se lit comme un mauvais PIN sur l’écran de verrouillage corrigé quatre secondes plus tard, pas comme une tentative de deviner le mot de passe.",
 "A separate alert at 20:48:10 (rule 67028, event 4672) shows the same account received administrator privileges such as SeDebugPrivilege, so an admin account is used for everyday work.": "Une autre alerte à 20:48:10 (règle 67028, événement 4672) montre que le même compte a reçu des privilèges administrateur comme SeDebugPrivilege : un compte admin sert donc au travail quotidien.",
 "Confirm with Team 1 that the owner of USER_1 unlocked the VM at 20:48 UTC.": "Confirmer avec l’équipe 1 que le propriétaire de USER_1 a déverrouillé la VM à 20:48 UTC.",
 "Use a standard account for daily work on the lab VM and keep admin rights for a separate account.": "Utiliser un compte standard pour le travail quotidien sur la VM du labo et garder les droits admin pour un compte séparé.",
 "Add a rule that alerts when a failed logon is followed within 60 seconds by an elevated logon for the same account.": "Ajouter une règle qui alerte quand un échec de connexion est suivi en moins de 60 secondes d’une connexion élevée du même compte.",
 "Whether the person at the console was the account owner.": "Si la personne à la console était le propriétaire du compte.",
 "What was done in the session after the unlock.": "Ce qui a été fait dans la session après le déverrouillage.",
 "Wazuh rates every account change level 8 (Medium). Here the change was made by SYSTEM four seconds after a sign-in attempt, and the only attribute with a value is the display name: no password, group or account-control change. That looks like routine Windows behaviour at sign-in.": "Wazuh classe toute modification de compte au niveau 8 (Moyenne). Ici, la modification a été faite par SYSTEM quatre secondes après une tentative de connexion, et le seul attribut renseigné est le nom d’affichage : aucun changement de mot de passe, de groupe ou de contrôle du compte. Cela ressemble à un comportement normal de Windows à la connexion.",
 "Account Manipulation (Wazuh mapping)": "Manipulation de compte (correspondance Wazuh)",
 "Windows refreshed the display name of USER_2 automatically during sign-in.": "Windows a actualisé automatiquement le nom d’affichage de USER_2 pendant la connexion.",
 "Team 1 set the display name to \"USER_3\" while preparing the lab VM.": "L’équipe 1 a défini le nom d’affichage « USER_3 » en préparant la VM du labo.",
 "Someone tampered with the account USER_2.": "Quelqu’un a manipulé le compte USER_2.",
 "Wazuh rule 60110 fired: user account changed.": "La règle Wazuh 60110 s’est déclenchée : compte utilisateur modifié.",
 "The underlying Windows event is 4738, a user account was changed.": "L’événement Windows sous-jacent est 4738, un compte utilisateur a été modifié.",
 "The account that was changed is USER_2.": "Le compte modifié est USER_2.",
 "The change was made by the operating system itself (SYSTEM, S-1-5-18), not by a person.": "La modification a été faite par le système d’exploitation lui-même (SYSTEM, S-1-5-18), pas par une personne.",
 "The attribute recorded in the event is the display name, now \"USER_3\".": "L’attribut enregistré dans l’événement est le nom d’affichage, désormais « USER_3 ».",
 "Windows logged the change at 20:48:11 UTC, four seconds after the failed logon in INC-01.": "Windows a enregistré la modification à 20:48:11 UTC, quatre secondes après l’échec de connexion de INC-01.",
 "Rule 60110 fired 4 times in this burst.": "La règle 60110 s’est déclenchée 4 fois dans cette rafale.",
 "Every other attribute in the event message is \"-\", so no password, group membership or account-control setting changed.": "Tous les autres attributs du message valent « - » : aucun mot de passe, appartenance à un groupe ou paramètre de contrôle du compte n’a changé.",
 "The alert arrived about 3 min 28 s after the event, the same gap as INC-01. A constant gap points to the Windows VM clock running behind the Wazuh server, not to a slow pipeline.": "L’alerte est arrivée environ 3 min 28 s après l’événement, le même écart que pour INC-01. Un écart constant indique que l’horloge de la VM Windows retarde sur le serveur Wazuh, pas un traitement lent.",
 "Ask Team 1 whether \"USER_3\" is the expected display name for USER_2.": "Demander à l’équipe 1 si « USER_3 » est le nom d’affichage attendu pour USER_2.",

    b.addEventListener('click', function () { state.lang = LANG = b.getAttribute('data-lang'); saveUi(); render(); });
  });
  document.querySelectorAll('[data-theme-set]').forEach(function (b) {
    b.addEventListener('click', function () { state.theme = b.getAttribute('data-theme-set'); saveUi(); applyTheme(); renderChrome(); });
  });
  render();

  if (!window.claude || typeof window.claude.use !== 'function') goLocal('');
  else {
    window.claude.use('db').then(function (db) { if (db) connectDb(db); else goLocal('Sign in to share this console with your class. For now it works in this browser only.'); },
      function () { goLocal(''); });
    window.claude.use('user').then(function (u) {
      if (!u) return;
      u.can('data.write').then(function (ok) { if (ok === false) { sync.canWrite = false; renderSyncChip(); } }, function () {});
    }, function () {});
    window.claude.use('sample').then(function (f) { if (f) { sampleFn = f; if (state.step === 'analyse') render(); } }, function () {});
    window.claude.use('downloads').then(function (d) { if (d) { downloads = d; render(); } }, function () {});
  }
})();
</script>

</body>
</html>
