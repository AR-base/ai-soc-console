<title>AI-Powered SOC Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: analyst desk — incident queue on the left, five-step case workspace on the right; redaction bars are the signature mark. */
:root {
  --bg: #ECEFF2; --surface: #FFFFFF; --surface-2: #F5F7F9; --ink: #13202B; --ink-2: #4B5A67; --ink-3: #6B7985;
  --line: #D3DAE0; --line-2: #E4E9ED;
  --accent: #0A6F6A; --accent-weak: #DCEFEE; --on-accent: #FFFFFF;
  --bar: #13202B; --on-bar: #F1F4F6;
  --ok: #1D7445; --ok-weak: #E1F2E8; --warn: #955800; --warn-weak: #FBEFD9; --bad: #B0261E; --bad-weak: #FBE3E1; --info: #35598F; --info-weak: #E2EAF6;
  --sev-low: #4E7A5B; --sev-medium: #A06E0C; --sev-high: #C2501A; --sev-critical: #A0142C;
  --f-display: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1318; --surface: #141C23; --surface-2: #19232C; --ink: #E3E9EE; --ink-2: #A3B1BC; --ink-3: #85939F;
  --line: #2A3641; --line-2: #202B35;
  --accent: #3DBAB2; --accent-weak: #123432; --on-accent: #04201E;
  --bar: #E3E9EE; --on-bar: #0D1318;
  --ok: #5DC48A; --ok-weak: #12301F; --warn: #E3A645; --warn-weak: #33260F; --bad: #F2766D; --bad-weak: #3A1715; --info: #8FB1E8; --info-weak: #17243A;
  --sev-low: #7DB38C; --sev-medium: #E0A93B; --sev-high: #F07A45; --sev-critical: #F2607A;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1318; --surface: #141C23; --surface-2: #19232C; --ink: #E3E9EE; --ink-2: #A3B1BC; --ink-3: #85939F;
  --line: #2A3641; --line-2: #202B35;
  --accent: #3DBAB2; --accent-weak: #123432; --on-accent: #04201E;
  --bar: #E3E9EE; --on-bar: #0D1318;
  --ok: #5DC48A; --ok-weak: #12301F; --warn: #E3A645; --warn-weak: #33260F; --bad: #F2766D; --bad-weak: #3A1715; --info: #8FB1E8; --info-weak: #17243A;
  --sev-low: #7DB38C; --sev-medium: #E0A93B; --sev-high: #F07A45; --sev-critical: #F2607A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .005em; }
p { margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: .86em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.nav { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 24px; padding-block: 10px 0; }
.brand { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; min-width: 0; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.brand .hint { font-size: 12.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; cursor: pointer; font-weight: 600; color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.tab .tn { font-family: var(--f-mono); font-size: 11px; font-weight: 500; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink-3); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] .tn { border-color: var(--accent); color: var(--accent); }
.tab:hover { color: var(--ink); }
.objective { color: var(--ink-2); max-width: 70ch; margin-top: 6px; }

/* redaction token — the signature mark */
.redact { display: inline-block; background: var(--bar); color: var(--on-bar); font-family: var(--f-mono); font-size: .82em; font-weight: 500; padding: 0 .4em; border-radius: 2px; line-height: 1.45; letter-spacing: .02em; }

/* desk layout */
.desk { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; padding-block: 24px 64px; align-items: start; }
.queue { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.queue h2 { font-size: 13px; font-family: var(--f-mono); font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.qcard { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 12px 12px 16px; cursor: pointer; display: grid; gap: 6px; position: relative; overflow: hidden; }
.qcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--sevc, var(--line)); }
.qcard[aria-current="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.qcard:hover { border-color: var(--ink-3); }
.qhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.qid { font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.qscen { display: block; font-family: var(--f-display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.qmeta { display: block; font-size: 12.5px; color: var(--ink-2); }
.dots { display: flex; gap: 3px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
.dots i.on { background: var(--accent); }
.queue .note { font-size: 12.5px; color: var(--ink-3); }

.sev { --c: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--c); white-space: nowrap; }
.sev::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: var(--c); }
.sev-Low { --c: var(--sev-low); } .sev-Medium { --c: var(--sev-medium); } .sev-High { --c: var(--sev-high); } .sev-Critical { --c: var(--sev-critical); }
.badge { display: inline-block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.badge.sample { border-style: dashed; }
.badge.live { border-color: var(--accent); color: var(--accent); }
.badge.warn { border-color: var(--warn); color: var(--warn); }

/* workspace */
.work { min-width: 0; display: grid; gap: 16px; }
.case-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.case-head h2 { font-size: 26px; font-weight: 700; }
.case-head h2 .mono { font-size: 15px; color: var(--ink-3); margin-right: 8px; font-weight: 500; }
.steps { display: flex; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow-x: auto; }
.step { flex: 1 0 auto; background: none; border: 0; border-right: 1px solid var(--line); padding: 10px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.step:last-child { border-right: 0; }
.step .num { font-family: var(--f-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--line); }
.step.done .num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step[aria-selected="true"] { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); font-weight: 600; }

.panel { grid-template-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 18px; min-width: 0; }
.panel h3 { font-size: 19px; font-weight: 600; }
.lede { color: var(--ink-2); max-width: 70ch; }
.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; }
.stack { display: grid; gap: 12px; min-width: 0; align-content: start; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
label.lbl { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
.hint { font-size: 13px; color: var(--ink-3); }
textarea, input[type="text"], select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 0; }
textarea { resize: vertical; }
textarea.code { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.5; min-height: 320px; white-space: pre; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.dark { background: var(--bar); color: var(--on-bar); border-color: var(--bar); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: 13px; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); font-size: 12.5px; padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface-2); display: grid; gap: 10px; min-width: 0; }
.msg { border-radius: 4px; padding: 8px 12px; font-size: 14px; }
.msg.bad { background: var(--bad-weak); color: var(--bad); }
.msg.ok { background: var(--ok-weak); color: var(--ok); }
.msg.warn { background: var(--warn-weak); color: var(--warn); }
.msg.info { background: var(--info-weak); color: var(--info); }

pre.json { margin: 0; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 12px; overflow: auto; max-height: 460px; white-space: pre; }
pre.json.wrap-lines { white-space: pre-wrap; overflow-wrap: anywhere; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }
.kept { color: var(--warn); font-weight: 600; font-size: 12.5px; }

/* analysis + claims */
.ai-block { display: grid; gap: 8px; align-content: start; }
.ai-block h4 { margin: 0; font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 500; }
ul.clean { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.clean li { display: flex; gap: 8px; align-items: baseline; }
.chip { font-family: var(--f-mono); font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.fact { border-color: var(--info); color: var(--info); }
.chip.inference { border-style: dashed; }
.prio-Now { border-color: var(--bad); color: var(--bad); }
.prio-Soon { border-color: var(--warn); color: var(--warn); }

.claim { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; background: var(--surface); position: relative; }
.claim[data-auto="conflict"], .claim[data-auto="missing"] { border-left: 4px solid var(--bad); }
.claim[data-auto="match"], .claim[data-auto="present"] { border-left: 4px solid var(--ok); }
.claim[data-auto="judgment"] { border-left: 4px dashed var(--ink-3); }
.claim .ctext { font-weight: 500; }
.claim .cnum { font-family: var(--f-mono); color: var(--ink-3); margin-right: 6px; }
.evidence { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.evidence dt { color: var(--ink-3); }
.evidence dd { margin: 0; font-family: var(--f-mono); font-size: 12.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
.auto { font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.auto.match, .auto.present { color: var(--ok); } .auto.conflict, .auto.missing { color: var(--bad); } .auto.judgment { color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"].v { background: var(--ok); color: var(--surface); }
.seg button[aria-pressed="true"].r { background: var(--bad); color: var(--surface); }
.seg button[aria-pressed="true"].u { background: var(--ink-2); color: var(--surface); }
.claim .note-in { font-size: 13px; padding: 5px 8px; }
.sevcheck { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sevcell { border: 1px solid var(--line); border-radius: 4px; padding: 10px; background: var(--surface); }
.sevcell .eyebrow { display: block; margin-bottom: 4px; }
.sevcell .big { font-family: var(--f-display); font-size: 20px; font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); cursor: pointer; }
.opt input { margin-top: 4px; accent-color: var(--accent); }

/* summary sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 28px 30px; display: grid; gap: 18px; max-width: 820px; box-shadow: 0 1px 0 var(--line), 0 8px 24px -16px rgba(0,0,0,.25); }
.sheet .stamp { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
.sheet h3 { font-size: 26px; font-weight: 700; }
.sheet h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
.sheet .struck { text-decoration: line-through; color: var(--ink-3); }
.sheet .ev { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.sheet .foot { font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 10px; }
.sheet .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 16px; font-size: 13.5px; }
.sheet .facts div span { display: block; color: var(--ink-3); font-size: 11.5px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; }
.sheet .facts div b { font-weight: 500; overflow-wrap: anywhere; }
.sheet .sevline { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; font-size: 14px; }
.sheet .sevline .sev { font-size: 16px; }

.site-foot { padding-block: 0 40px; font-size: 12.5px; color: var(--ink-3); }
/* shared view shell */
.view { padding-block: 28px 64px; display: grid; gap: 20px; max-width: 1160px; margin: 0 auto; }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.vhead h1 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 700; line-height: 1.05; margin-top: 4px; }
.vhead > div:first-child { min-width: 0; flex: 1 1 420px; }
.code-wrap { position: relative; min-width: 0; }
.code-wrap pre { padding-right: 66px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; }
.code-wrap .copy { position: absolute; top: 6px; right: 6px; }
.stepname { font-family: var(--f-display); font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.stepname .num { font-family: var(--f-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--bar); color: var(--on-bar); }
.strip { display: flex; flex-wrap: wrap; gap: 6px; }
.scen { border-top: 4px solid var(--accent); }
.scen .chip { white-space: normal; }
.checks-list { display: grid; gap: 6px; }
.checks-list label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.checks-list input { margin-top: 3px; accent-color: var(--accent); }

/* command center */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 4px; align-content: start; background: var(--surface); border-top: 4px solid var(--kc, var(--line)); }
.kpi b { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12.5px; }
.kpi-good { --kc: var(--ok); } .kpi-warn { --kc: var(--warn); } .kpi-bad { --kc: var(--bad); } .kpi-none { --kc: var(--line); }
.tl { display: grid; gap: 8px; }
.tl-track { position: relative; height: 92px; border-bottom: 2px solid var(--ink-3); margin: 0 4px; }
.tl-pt { position: absolute; bottom: -7px; display: grid; justify-items: center; gap: 4px; transform: translateX(-50%); }
.tl-pt.left { justify-items: start; transform: translateX(-6px); }
.tl-pt.right { justify-items: end; transform: translateX(calc(-100% + 6px)); }
.tl-pt .tl-lab { order: -1; font-size: 12.5px; line-height: 1.3; white-space: nowrap; text-align: inherit; }
.tl-pt.left .tl-lab { text-align: left; } .tl-pt.right .tl-lab { text-align: right; }
.tl-pt .tl-lab b { font-family: var(--f-mono); font-size: 12px; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sevc); box-shadow: 0 0 0 3px var(--surface); }
.board { display: grid; gap: 12px; }
.inc { border: 1px solid var(--line); border-left: 6px solid var(--sevc, var(--line)); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) minmax(0, 260px); gap: 16px; background: var(--surface); }
.inc .inc-title { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.inc .mini { font-size: 13px; color: var(--ink-2); }
.inc ul.clean li { font-size: 14px; }
.pb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pb-col { border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 8px; align-content: start; background: var(--surface-2); }
.pb-col h4 { margin: 0; font-family: var(--f-display); font-size: 16px; }
.pb-phase { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-top: 4px; }
.pb-col ul { margin: 0; padding-left: 16px; font-size: 13.5px; display: grid; gap: 3px; }
.speech { font-size: 16px; line-height: 1.65; max-width: 72ch; white-space: pre-wrap; border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .inc { grid-template-columns: minmax(0, 1fr); } .pb { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .brand .hint { display: none; } .nav { padding-block: 8px 0; } .brand { padding-bottom: 4px; } .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .kpi b { font-size: 24px; } }

/* AI-only view */
.ai-view { padding-block: 28px 64px; display: grid; gap: 20px; max-width: 1120px; margin: 0 auto; }
.ai-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.ai-top h1 { font-size: clamp(28px, 4.5vw, 40px); font-weight: 700; line-height: 1.05; margin-top: 4px; }

<script>
(function () {
  'use strict';
  var TEAM = [
    { name: 'Team 3 lead', role: 'Team lead' },
    { name: 'Team 3 analyst A', role: '' },
    { name: 'Team 3 analyst B', role: '' },
    { name: 'Team 3 analyst C', role: '' }
  ];
  var DEFS = [
    { id: 'INC-01', scenario: 'Failed logins' },
    { id: 'INC-02', scenario: 'Unusual access' },
    { id: 'INC-03', scenario: 'Sensitive change' }
  ];
  var STEPS = [['intake', 'Intake'], ['redact', 'Redact'], ['analyse', 'Ask AI'], ['verify', 'Verify'], ['summary', 'Summary']];
  var PEOPLE = ['Team 1 lead', 'Team 2 analyst', 'Team 3 lead', 'Team 3 analyst A', 'Team 3 analyst B', 'Team 3 analyst C', 'Team 4 lead'];
  var DECISIONS = Core.DECISIONS;
  var SAMPLE_RAW = LabData.SAMPLE_ALERTS.map(function (a) { return JSON.stringify(a, null, 2); });
  // Real alerts exported from the lab's Wazuh, per incident (null = none yet).
  var REAL_RAW = LabData.REAL.map(function (r) { return r ? JSON.stringify(r.doc, null, 2) : null; });
  var REAL_ID = LabData.REAL.map(function (r) { return r ? String((r.doc._source || r.doc).id) : null; });
  var DEFAULT_RAW = SAMPLE_RAW.map(function (x, i) { return REAL_RAW[i] || x; });

  /* ---------- state ----------
     Shared case file (db): soc/config + incidents/INC-0n, live for everyone the console is shared with.
     Per-viewer UI (tab, incident, step) stays in this browser. Without db the console runs locally. */

  var emptyReview = Core.emptyReview, emptyT2 = Core.emptyT2, emptyT4 = Core.emptyT4;
  var UI_STORE = 'soc-console-ui', LOCAL_STORE = 'soc-console-local-v5';
  var UI_KEYS = ['view', 'current', 'step', 'includeContext'];

  function freshCase() { return Core.initialCase(LabData, DEFS); }
  function loadUi() {
    var d = { view: 'detect', current: 0, step: 'intake', includeContext: true };
    try {
      var u = JSON.parse(localStorage.getItem(UI_STORE) || 'null');
      if (u && typeof u === 'object') {
        if (['detect', 'ai', 'desk', 'command', 'method'].indexOf(u.view) >= 0) d.view = u.view;
        if (u.current === 0 || u.current === 1 || u.current === 2) d.current = u.current;
        if (['intake', 'redact', 'analyse', 'verify', 'summary'].indexOf(u.step) >= 0) d.step = u.step;
        if (typeof u.includeContext === 'boolean') d.includeContext = u.includeContext;
      }
    } catch (e) { /* storage unavailable */ }
    return d;
  }
  function saveUi() {
    var u = {}; UI_KEYS.forEach(function (k) { u[k] = state[k]; });
    try { localStorage.setItem(UI_STORE, JSON.stringify(u)); } catch (e) { /* storage unavailable */ }
  }
  function withCase(c) {
    state.tokens = c.tokens; state.customTerms = c.customTerms; state.keep = c.keep; state.incidents = c.incidents;
  }

  var state = loadUi();
  withCase(freshCase());          // placeholder until the shared case arrives (or for local mode)

  var sync = {
    mode: 'connecting',           // connecting | shared | empty | local
    db: null, canWrite: true, note: '', noteKind: 'info', slow: false,
    lastSynced: {}, inflight: {}, again: {}, writtenAt: {}, queued: {}, got: { config: false, incidents: false }, count: 0, pendingRender: false
  };

  // Key-order-independent JSON: the store returns fields sorted, so compare canonical forms.
  function canon(v) {
    if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + canon(v[k]); }).join(',') + '}';
    return JSON.stringify(v === undefined ? null : v);
  }
  function docsFromState() {
    var out = { 'soc/config': { tokens: state.tokens || [], customTerms: state.customTerms || '', keep: state.keep || [] } };
    state.incidents.forEach(function (inc) { out['incidents/' + inc.id] = inc; });
    return out;
  }
  var saveTimer = null;
  function save() {
    saveUi();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 600);         // one write per pause in typing
  }
  function flush() {
    if (sync.mode === 'local') {
      try { localStorage.setItem(LOCAL_STORE, JSON.stringify({ tokens: state.tokens, customTerms: state.customTerms, keep: state.keep, incidents: state.incidents })); } catch (e) { /* storage unavailable */ }
      return;
    }
    if (sync.mode !== 'shared' || !sync.canWrite) return;
    var docs = docsFromState();
    Object.keys(docs).forEach(function (path) {
      var json = canon(docs[path]);
      if (json !== sync.lastSynced[path]) writeDoc(path, json);
    });
  }
  function writeDoc(path, json) {
    if (sync.inflight[path]) { sync.again[path] = true; return; }   // one write at a time per document
    sync.inflight[path] = true;
    sync.writtenAt[path] = Date.now();
    var prev = sync.lastSynced[path];
    sync.lastSynced[path] = json;
    sync.db.doc(path).set(JSON.parse(json)).then(function () {
      if (sync.noteKind === 'warn' && sync.canWrite) setNote('', 'info');
    }, function (e) {
      var c = e && e.code;
      sync.lastSynced[path] = prev;
      if (c === 'quota_exceeded') setNote('The shared case file is full, so changes are not being saved. Remove a pasted alert or reset the case.', 'bad');
      else if (c === 'revoked' || c === 'not_granted' || c === 'invalid_argument') { sync.canWrite = false; setNote('You can view this console but not change it. Ask the owner for Contributor or Editor access.', 'warn'); }
      else setNote('A change could not be saved yet. It is retried with your next edit.', 'warn');
    }).then(function () {
      sync.inflight[path] = false;
      if (sync.again[path]) { sync.again[path] = false; flush(); }
    });
  }
  function applyRemote(path, data) {
    var json = canon(data);
    if (json === sync.lastSynced[path]) return false;               // our own write echoing back
    sync.lastSynced[path] = json;
    if (path === 'soc/config') {
      var c = Core.normalizeConfig(data);
      state.tokens = c.tokens; state.customTerms = c.customTerms; state.keep = c.keep;
      return true;
    }
    var i = DEFS.map(function (d) { return 'incidents/' + d.id; }).indexOf(path);
    if (i < 0) return false;
    if (sync.mode !== 'connecting' && fieldFocused()) {          // someone is typing: hold it until they leave the field
      sync.lastSynced[path] = undefined;
      sync.queued[path] = { data: data, at: Date.now() };
      return false;
    }
    var inc = Core.normalizeIncident(data, DEFS[i]);
    if (!inc) return false;
    state.incidents[i] = inc;
    return true;
  }
  function setNote(text, kind) {
    sync.note = text; sync.noteKind = kind || 'info';
    renderSyncChip();
    var el = document.getElementById('sync-note');
    if (el) { el.hidden = !text; el.textContent = text; el.className = 'msg ' + sync.noteKind; }
  }
  function fieldFocused() {
    var a = document.activeElement;
    return !!(a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }
  function scheduleRender() {
    if (fieldFocused()) { sync.pendingRender = true; return; }       // never yank a field from under someone typing
    render();
  }
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      if (fieldFocused()) return;
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; flush(); }   // save what was just typed before taking others' changes
      var changed = false;
      Object.keys(sync.queued).forEach(function (path) {
        var q = sync.queued[path]; delete sync.queued[path];
        if ((sync.writtenAt[path] || 0) > q.at) return;            // our edit is newer: last writer wins
        if (applyRemote(path, q.data)) changed = true;
      });
      if (changed || sync.pendingRender) { sync.pendingRender = false; render(); }
    }, 0);
  });

  function maybeReady() {
    if (sync.mode !== 'connecting' || !sync.got.config || !sync.got.incidents) return;
    sync.mode = sync.count ? 'shared' : 'empty';
    if (sync.mode === 'shared') fillMissing();
    render();
  }
  // A case file with some incidents missing gets the starting version of just those.
  function fillMissing() {
    var have = sync.lastSynced;
    var base = null;
    DEFS.forEach(function (d, i) {
      if (have['incidents/' + d.id]) return;
      base = base || freshCase();
      state.incidents[i] = base.incidents[i];
    });
    if (base) save();
  }
  function startSharedCase() {
    if (!sync.db || !sync.canWrite) return;
    withCase(freshCase());
    sync.mode = 'shared';
    flush(); render();
  }
  function goLocal(reason) {
    if (sync.mode === 'local') return;
    sync.mode = 'local';
    try {
      var c = JSON.parse(localStorage.getItem(LOCAL_STORE) || 'null');
      if (c && Array.isArray(c.incidents) && c.incidents.length === 3) {
        var cfg = Core.normalizeConfig(c);
        var incs = c.incidents.map(function (x, i) { return Core.normalizeIncident(x, DEFS[i]); });
        if (incs.every(Boolean)) withCase({ tokens: cfg.tokens, customTerms: cfg.customTerms, keep: cfg.keep, incidents: incs });
      }
    } catch (e) { /* storage unavailable */ }
    setNote(reason || '', 'info');
    render();
  }
  function connectDb(db) {
    sync.db = db;
    var slow = setTimeout(function () { if (sync.mode === 'connecting') { sync.slow = true; render(); } }, 10000);
    db.collection('incidents').onSnapshot(function (snap) {
      var changed = false;
      snap.docs.forEach(function (d) { if (d.exists && applyRemote('incidents/' + d.id, d.data())) changed = true; });
      if (!snap.metadata.fromCache) { sync.got.incidents = true; sync.count = snap.size; clearTimeout(slow); }
      if (sync.mode === 'connecting') maybeReady();
      else if (changed) { if (sync.mode === 'empty' && snap.size) sync.mode = 'shared'; scheduleRender(); }
    }, function (e) { clearTimeout(slow); dbLost(e); });
    db.doc('soc/config').onSnapshot(function (d) {
      var changed = d.exists ? applyRemote('soc/config', d.data()) : false;
      if (!d.metadata.fromCache) sync.got.config = true;
      if (sync.mode === 'connecting') maybeReady();
      else if (changed) scheduleRender();
    }, function (e) { dbLost(e); });
  }
  function dbLost(e) {
    var c = e && e.code;
    if (sync.mode === 'connecting') { goLocal('The shared case file could not be opened, so this console is working in this browser only.'); return; }
    sync.canWrite = c === 'revoked' ? false : sync.canWrite;
    setNote(c === 'revoked' ? 'Your access to the shared case file changed. Reload the page to continue.' : 'Live updates stopped. Reload the page to see the latest changes.', 'warn');
  }
  function renderSyncChip() {
    var el = document.getElementById('sync-chip');
    if (!el) return;
    var t = { connecting: 'Connecting…', shared: sync.canWrite ? 'Shared · live' : 'Shared · view only', empty: 'Shared · empty', local: 'This browser only' }[sync.mode];
    el.textContent = t;
    el.className = 'badge ' + (sync.mode === 'shared' && sync.canWrite ? 'live' : sync.mode === 'local' ? 'sample' : 'warn');
  }

  var ui = { lastRun: null, running: null, status: '', statusKind: 'info', paste: '', pasteError: '', resetArmed: false, sampleOff: false };
  var ctl = null;
  var sampleFn = null, downloads = null;

  function derive() {
    var parsed = state.incidents.map(function (inc) { return Core.parseAlert(inc.raw); });
    var alerts = parsed.map(function (p) { return p.ok ? p.alert : null; });
    var r = Core.redactAll(alerts, state.customTerms, state.keep, state.tokens);
    if (JSON.stringify(r.tokens) !== JSON.stringify(state.tokens || [])) { state.tokens = r.tokens; save(); }
    return { parsed: parsed, entities: r.entities, tokens: r.tokens, redacted: r.redacted };
  }

  /* ---------- DOM helpers (text only, never innerHTML for data) ---------- */

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'style') el.setAttribute('style', v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); return; }
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  function tokenized(text, tag) {
    var el = h(tag || 'span');
    Core.tokenSegments(text).forEach(function (s) {
      el.append(s.token ? h('span', { class: 'redact', text: s.t }) : document.createTextNode(s.t));
    });
    return el;
  }
  function sevPill(sev, label) {
    if (!sev || Core.SEVERITIES.indexOf(sev) < 0) return h('span', { class: 'sev', text: label || 'Unrated' });
    return h('span', { class: 'sev sev-' + sev, text: label || sev });
  }
  function toast(text) {
    var t = h('div', { class: 'toast', role: 'status', text: text });
    document.body.append(t);
    setTimeout(function () { t.remove(); }, 1800);
  }
  function copyText(text, label) {
    var done = function () { toast((label || 'Text') + ' copied'); };
    var fallback = function () {
      var ta = h('textarea', { class: 'code', readonly: true, value: text, 'aria-label': 'Text to copy', style: 'min-height:260px' });
      var ov = h('div', { class: 'overlay', role: 'dialog', 'aria-label': 'Copy text' },
        h('div', { class: 'box' },
          h('div', { class: 'row between' }, h('strong', { text: 'Select all and copy' }),
            h('button', { class: 'btn small', text: 'Close', onclick: function () { ov.remove(); } })),
          ta));
      document.body.append(ov);
      ta.focus(); ta.select();
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  function saveFile(name, text) {
    if (!downloads) { copyText(text, 'Markdown'); return; }
    downloads.save({ filename: name, data: text }).then(function () { toast('Saved ' + name); }, function (e) {
      if (e && e.code === 'declined') return;
      copyText(text, 'Markdown');
    });
  }
  function nowStamp() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ---------- progress ---------- */

  function stepDone(i, step, D) {
    var inc = state.incidents[i];
    switch (step) {
      case 'intake': return D.parsed[i].ok;
      case 'redact': return D.parsed[i].ok && inc.redactionChecked;
      case 'analyse': return !!inc.analysis && inc.analysisSource !== 'example';
      case 'verify': return !!inc.analysis && !!inc.review.finalSeverity && inc.review.claims.every(function (c) { return c.status !== 'pending'; });
      case 'summary': return inc.sent;
    }
    return false;
  }
  function displaySeverity(i, D) {
    var inc = state.incidents[i];
    if (inc.review.finalSeverity) return { sev: inc.review.finalSeverity, why: 'final' };
    if (inc.analysis && inc.analysis.severity !== 'Unrated') return { sev: inc.analysis.severity, why: 'AI' };
    if (D.parsed[i].ok) return { sev: Core.wazuhBand(Core.keyFields(D.parsed[i].alert).level), why: 'Wazuh' };
    return { sev: '', why: '' };
  }

  /* ---------- render: shell ---------- */

  function renderTabs() {
    document.querySelectorAll('.tab').forEach(function (b) {
      var on = b.dataset.view === state.view || (state.view === 'desk' && b.dataset.view === 'ai');
      b.setAttribute('aria-selected', String(on));
    });
  }
  function viewHead(eyebrow, title, objective, right) {
    return h('div', { class: 'vhead' },
      h('div', null, h('div', { class: 'eyebrow', text: eyebrow }), h('h1', { text: title }), objective ? h('p', { class: 'objective', text: objective }) : null),
      right || null);
  }
  function stateView(title, text, action) {
    return h('div', { class: 'view' }, h('section', { class: 'panel', style: 'max-width:640px' },
      h('div', { class: 'eyebrow', text: 'Shared case file' }), h('h3', { text: title }), h('p', { class: 'lede', text: text }), action));
  }
  function switchView(v) { state.view = v; save(); render(); window.scrollTo(0, 0); }
  function render() {
    renderTabs();
    var app = document.getElementById('app');
    app.textContent = '';
    renderSyncChip();
    if (sync.mode === 'connecting') { app.append(stateView('Opening the shared case file…', sync.slow ? 'This is taking longer than usual. Check your connection; the console keeps trying.' : 'Loading the latest alerts, reviews and decisions from your class.', null)); return; }
    if (sync.mode === 'empty') {
      app.append(stateView('The shared case file is empty', 'Start it from the three real alerts on the lab VM. Everyone you share this console with will see the same incidents, reviews and decisions.',
        sync.canWrite ? h('button', { class: 'btn primary', text: 'Start the shared case file', onclick: startSharedCase }) : h('p', { class: 'hint', text: 'Ask the owner to start it; you have view-only access.' })));
      return;
    }
    app.append(h('div', { id: 'sync-note', class: 'msg ' + sync.noteKind, hidden: !sync.note, text: sync.note, style: 'margin-top:16px' }));
    var D = derive();
    if (state.view === 'detect') { app.append(renderDetect(D)); return; }
    if (state.view === 'command') { app.append(renderCommand(D)); return; }
    if (state.view === 'ai') { app.append(renderAi(D)); return; }

      h('div', { class: 'score' },
        h('div', null, h('b', { text: String(held) }), h('span', { text: 'claims verified' })),
        h('div', null, h('b', { text: String(wrong) }), h('span', { text: 'claims rejected' })),
        h('div', null, h('b', { text: String(autoCaught) }), h('span', { text: 'flagged by the field check' })),
        h('div', null, h('b', { text: String(tbd) }), h('span', { text: 'still to review' }))),
      h('div', { class: 'row' },
        h('button', { class: 'btn primary', text: 'Copy evidence pack (Markdown)', onclick: function () { copyText(packMarkdown(D, { held: held, wrong: wrong, autoCaught: autoCaught, tbd: tbd }), 'Evidence pack'); } }),
        downloads ? h('button', { class: 'btn', text: 'Save evidence pack .md', onclick: function () { saveFile('team3-ai-analysis-pack.md', packMarkdown(D, { held: held, wrong: wrong, autoCaught: autoCaught, tbd: tbd })); } }) : null)));

    wrap.append(h('section', { class: 'panel' },
      h('h3', { text: 'How Team 3 works' }),
      h('ol', { class: 'steps-list' },
        h('li', null, h('b', { text: 'Collect' }), ' three alerts from Team 2: alert ID, raw evidence, Wazuh level.'),
        h('li', null, h('b', { text: 'Redact' }), ' accounts, host names, IPs and emails into consistent tokens. A leak check confirms no original value remains.'),
        h('li', null, h('b', { text: 'Ask AI' }), ' with a fixed prompt: severity, hypotheses, response options, and claims that each cite one alert field.'),
        h('li', null, h('b', { text: 'Verify' }), ' every claim. The page reads the cited field; an analyst marks it Verified, Rejected or Can’t tell. A human sets the final severity.'),
        h('li', null, h('b', { text: 'Send' }), ' a one-page summary to Team 4 with verified findings only, rejected AI claims shown struck through, and selected actions.'))));

    var prompts = h('div', { class: 'stack' });
    state.incidents.forEach(function (inc, i) {
      if (!D.redacted[i]) return;
      var p = promptFor(i, D);
      var pre = tokenized(p, 'pre'); pre.className = 'json wrap-lines';
      prompts.append(h('details', null, h('summary', { text: 'Prompt for ' + inc.id + ' — ' + inc.scenario }),
        h('div', null, pre, h('div', { class: 'row' }, h('button', { class: 'btn small', text: 'Copy', onclick: function () { copyText(p, 'Prompt'); } })))));
    });
    wrap.append(h('section', { class: 'panel' },
      h('h3', { text: 'AI prompts' }),
      h('p', { class: 'lede', text: 'One prompt design for all incidents. It forces the AI to tie each fact to a field, which is what makes checking possible, and to include the lab-test hypothesis.' }),
      prompts));

    var vt = h('tbody');
    Object.keys(AUTO).forEach(function (k) {
      vt.append(h('tr', null, h('td', null, h('span', { class: 'auto ' + k, text: AUTO[k][0] + ' ' + AUTO[k][1] })),
        h('td', { text: { match: 'Usually Verified.', present: 'Check the value yourself.', conflict: 'Usually Rejected. Record what the log shows.', missing: 'Rejected, or ask Team 2 for the field.', judgment: 'Verified only if the analyst agrees; otherwise Can’t tell.' }[k] })));
    });
    wrap.append(h('section', { class: 'panel' },
      h('h3', { text: 'Human verification' }),
      h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, h('th', { text: 'Automatic field check' }), h('th', { text: 'What the analyst does' }))), vt)),
      h('p', { class: 'hint', text: 'The field check is a helper, not a verdict. A matching field can still be read wrongly, as in INC-01, where Wazuh’s rule name says bad password but the sub-status says wrong PIN.' })));

    var lim = h('ul', { class: 'stack', style: 'padding-left:18px;gap:6px' });
    LIMITS.forEach(function (t) { lim.append(h('li', { text: t })); });
    wrap.append(h('section', { class: 'panel' }, h('h3', { text: 'Limitations' }), lim));

    wrap.append(h('section', { class: 'panel' },
      h('h3', { text: 'Reset' }),
      h('p', { class: 'lede', text: sync.mode === 'shared' ? 'Restore the three real lab alerts with the prepared analyses. This clears every review and decision for everyone using this console.' : 'Restore the three real lab alerts with the prepared analyses. This clears your reviews in this browser.' }),
      h('div', { class: 'row' }, h('button', { class: 'btn ' + (ui.resetArmed ? 'dark' : ''), text: ui.resetArmed ? 'Click again to reset for everyone' : 'Reset the case file', disabled: sync.mode === 'shared' && !sync.canWrite ? true : null,
        onclick: function () {
          if (!ui.resetArmed) { ui.resetArmed = true; render(); setTimeout(function () { ui.resetArmed = false; if (state.view === 'method') render(); }, 4000); return; }
          ui.resetArmed = false; withCase(freshCase()); save(); render(); toast('Case file reset');
        } }))));
    return wrap;
  }

  var LIMITS = [
    'The AI sees one redacted alert and short summaries of the others. It cannot query Wazuh, so it cannot know what happened before or after.',
    'AI answers change between runs and can state wrong facts confidently. In the lab samples one claim per incident was false, and only checking the field exposed it. Even Wazuh can mislead: rule 60122 says "bad password" for what the sub-status shows was a wrong PIN.',
    'The field check compares text. It cannot tell whether a field means what the AI says it means; that needs a person.',
    'Redaction is rule-based. Names inside free text that are not in known fields can slip through; add them under Extra terms and rely on the leak check.',
    'Tokens are pseudonyms, not anonymisation. Anyone this console is shared with can reverse them, so share it only with the class; the AI never receives the mapping.',
    'Severity from the AI is advisory. The final severity is set by a Team 3 analyst and can differ from both the AI and the Wazuh level.',
    'Lab data only. The prompts, thresholds and redaction rules were not tested on production traffic.'
  ];

  function packMarkdown(D, sc) {
    var L = ['# Team 3 · AI Analysis — evidence pack', '', 'Team: ' + TEAM.map(function (t) { return t.name; }).join(', '), 'Prepared ' + nowStamp(), '',
      '## AI accuracy', '- Claims verified: ' + sc.held, '- Claims rejected: ' + sc.wrong, '- Flagged by the field check: ' + sc.autoCaught, '- Still to review: ' + sc.tbd, ''];
    state.incidents.forEach(function (inc, i) {
      if (!inc.analysis || !D.redacted[i]) return;
      L.push('---', '', Core.summaryMarkdown(summaryFor(i, D), nowStamp()), '');
    });
    L.push('---', '', '## Prompt used (' + state.incidents[0].id + ')', '', '```', D.redacted[0] ? promptFor(0, D) : '', '```', '');
    L.push('## Human verification', '- Every AI fact must cite one alert field. The page reads that field and flags matches and conflicts.', '- An analyst marks each claim Verified, Rejected or Can’t tell and sets the final severity.', '- Only verified claims and selected actions go to Team 4.', '');
    L.push('## Limitations');
    LIMITS.forEach(function (t) { L.push('- ' + t); });
    return L.join('\n');
  }

  /* ---------- boot ---------- */

  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { switchView(b.dataset.view); });
  });
  render();

  if (!window.claude || typeof window.claude.use !== 'function') goLocal('');
  else {
    window.claude.use('db').then(function (db) { if (db) connectDb(db); else goLocal('Sign in to share this console with your class. For now it works in this browser only.'); },
      function () { goLocal(''); });
    window.claude.use('user').then(function (u) {
      if (!u) return;
      u.can('data.write').then(function (ok) { if (ok === false) { sync.canWrite = false; renderSyncChip(); } }, function () {});
    }, function () {});
    window.claude.use('sample').then(function (f) { if (f) { sampleFn = f; if (state.step === 'analyse') render(); } }, function () {});
    window.claude.use('downloads').then(function (d) { if (d) { downloads = d; render(); } }, function () {});
  }
})();
</script>
